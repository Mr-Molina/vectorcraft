- id: VEC-002
  name: Engine Command and Error Literal i18n Synchronization
  failure_type: build
  root_cause_category: i18n_catalog_drift
  description: In VectorCraft, `ui-egui` CI tests strictly require 100% translation coverage for all command labels in `command_specs()` across complete languages (`ja`, `es`, `it`, `zh-hans`, `zh-hant`, `pt-br`, `cs`) and every `EngineError::Other(...)` literal across `es` and `it`. When introducing new commands or errors, agents MUST reuse existing translated strings or append translations to all 7 language TSVs in `crates/ui-egui/src/i18n/`.
